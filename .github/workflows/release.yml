name: Publish signed Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Prepare FFmpeg binaries
        shell: pwsh
        run: ./scripts/prepare-ffmpeg.ps1
      - name: Install frontend dependencies
        run: npm install --no-fund --no-audit
      - name: Run tests
        run: npm test
      - name: Validate tag and signing configuration
        shell: pwsh
        run: ./scripts/prepare-release.ps1
      - name: Build, sign, and publish stable Windows release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Varispeed ${{ github.ref_name }}'
          releaseBody: |
            Windows x64 installer with signed in-app updates.
            Install the NSIS setup executable once, then update through Varispeed.
            Windows publisher signing is separate from Tauri updater signatures.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
