name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Signed Windows installer and updater feed
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Prepare FFmpeg and FFprobe sidecars
        shell: pwsh
        run: ./scripts/prepare-ffmpeg.ps1
      - name: Install frontend dependencies
        run: npm install --no-fund --no-audit
      - name: Run regression tests
        run: npm test
      - name: Validate signing configuration and release tag
        shell: pwsh
        run: ./scripts/prepare-release.ps1
      - name: Build, sign and publish a stable release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Varispeed ${{ github.ref_name }}'
          releaseBody: |
            Windows x64 installer with authenticated in-app updates.
            Choose the NSIS setup executable to enable updates from within Varispeed.
            This build has a signed updater payload. Windows publisher code signing is separate.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
